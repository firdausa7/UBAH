# Ubah + Postgres on one server.
#   1. cp .env.example .env   and fill it in (set POSTGRES_PASSWORD too)
#   2. docker compose up -d --build
#   3. docker compose exec app node --import tsx src/createAdmin.ts --login <login> --name "<name>"
# Put a TLS reverse proxy (Caddy, nginx, a cloud load balancer) in front: the app listens on localhost only.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ubah
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ubah
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ubah -d ubah"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://ubah:${POSTGRES_PASSWORD}@db:5432/ubah
      TRUST_PROXY: ${TRUST_PROXY:-1}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    stop_grace_period: 25s

volumes:
  pgdata:
