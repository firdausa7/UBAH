name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Lint, typecheck and tests (embedded Postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      # npm test also runs the React app's tests, which need its own packages.
      - run: npm ci --prefix web
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  postgres:
    name: Tests on real Postgres 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ubah
          POSTGRES_PASSWORD: ubah
          POSTGRES_DB: ubah_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ubah" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://ubah:ubah@localhost:5432/ubah_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      # npm test also runs the React app's tests, which need its own packages.
      - run: npm ci --prefix web
      - run: npm test

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ubah:ci .
